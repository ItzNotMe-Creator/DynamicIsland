name: NoelIsland
options:
  bundleIdPrefix: app.noelisland
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  NoelIsland:
    type: application
    platform: iOS
    sources:
      - path: NoelIsland
      - path: Shared
    info:
      path: NoelIsland/Info.plist
      properties:
        CFBundleDisplayName: "Noel Island"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noelisland.christmas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: NoelIsland/Info.plist
    dependencies:
      - target: NoelIslandWidget
        embed: true
  NoelIslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NoelIslandWidget
      - path: Shared
    info:
      path: NoelIslandWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noelisland.christmas.widget
        INFOPLIST_FILE: NoelIslandWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: "YES"
